<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descargas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;600;700&display=swap">
<style id="css">
:root{color-scheme:light;--bg:#EEF1F4;--sf:#fff;--ink:#1D2733;--mut:#5C6978;--ln:#CBD3DC;--ac:#FFC800;--aci:#1D2733;--bad:#B3261E;--edge:#1D2733;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141A21;--sf:#1D252E;--ink:#E9EEF3;--mut:#9AA7B5;--ln:#34404D;--aci:#1B1F24;--bad:#FF8A80;--edge:#56657A}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141A21;--sf:#1D252E;--ink:#E9EEF3;--mut:#9AA7B5;--ln:#34404D;--aci:#1B1F24;--bad:#FF8A80;--edge:#56657A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1,h2,.brand,.ico,.cnt b{font-family:'Archivo Black','Arial Black','Helvetica Neue',Arial,sans-serif;font-weight:400}
.hd{background:var(--sf);border-bottom:2px solid var(--edge)}
.in,main{max-width:760px;margin:0 auto;padding-left:16px;padding-right:16px}
.in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;line-height:1}
.mark{width:26px;height:26px;background:var(--ac);border:2px solid var(--edge);border-radius:5px;position:relative}
.mark::after{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--edge)}
.who{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
main{padding-bottom:48px}
.intro{padding:28px 0 6px}
h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 8px;letter-spacing:-.01em}
.intro p{margin:0;color:var(--mut);max-width:52ch}
.ctl{display:flex;flex-direction:column;gap:12px;padding:18px 0 16px}
.q{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--edge);border-radius:6px;background:var(--sf);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips:empty{display:none}
.chip{font:inherit;font-size:14px;font-weight:600;padding:7px 13px;border:2px solid var(--edge);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.admbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:2px dashed var(--edge);border-radius:6px;margin-top:14px;font-size:14px}
#list{border-top:2px solid var(--edge)}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:12px 14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--ln)}
.ico{width:48px;height:48px;border-radius:10px;color:#fff;display:grid;place-items:center;font-size:18px;line-height:1}
.txt h3{margin:0;font-size:17px;line-height:1.25}
.ver{font-weight:400;font-size:14px;color:var(--mut);margin-left:4px}
.txt p{margin:3px 0 0;color:var(--mut);font-size:14.5px}
.meta{display:flex;gap:10px;align-items:center;margin-top:7px;font-size:13px;color:var(--mut)}
.tag{border:1.5px solid var(--edge);border-radius:4px;padding:0 6px;font-weight:600;color:var(--ink)}
.adm{display:flex;gap:16px;margin-top:6px}
.go{align-self:center}
.btn{font:inherit;font-weight:700;display:inline-block;text-align:center;text-decoration:none;line-height:1.2;padding:10px 16px;border:2px solid var(--edge);border-radius:6px;background:var(--ac);color:var(--aci);cursor:pointer;box-shadow:3px 3px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none}
.btn.off{opacity:.4;pointer-events:none;box-shadow:none}
.lnk{font:inherit;font-size:14px;background:none;border:0;padding:4px 0;color:var(--ink);text-decoration:underline;cursor:pointer}
.lnk.bad{color:var(--bad)}
.empty{padding:32px 0;margin:0;color:var(--mut)}
dialog{width:calc(100% - 24px);max-width:440px;padding:0;border:2px solid var(--edge);border-radius:10px;background:var(--sf);color:var(--ink)}
dialog::backdrop{background:rgba(10,14,19,.62)}
.dw,.f{padding:20px}
dialog h2{font-size:22px;line-height:1.15;margin:0 0 6px}
.sub{margin:0 0 14px;color:var(--mut);font-size:14.5px}
.ad{min-height:250px;border:2px dashed var(--ln);border-radius:6px;display:grid;place-items:center;color:var(--mut);font-size:13px;margin-bottom:16px;overflow:hidden}
.cnt{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.cnt b{font-size:44px;line-height:1}
.bar{position:relative;height:30px;border:3px solid var(--edge);border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--ac);transition:width .2s linear}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 3px),var(--sf) calc(10% - 3px) 10%)}
.hint{min-height:1.5em;margin:8px 0 4px;color:var(--mut);font-size:14px}
.acts{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
.f label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.f input,.f select,.f textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--edge);border-radius:6px;background:var(--bg);color:var(--ink)}
.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:14px;min-height:1.4em;margin:10px 0 0}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);z-index:5}
@media(max-width:520px){.row{grid-template-columns:48px 1fr}.go{grid-column:1/-1;width:100%}}
@media(max-width:420px){.who span{display:none}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script id="data" type="application/json">{"items":[]}</script>
<script id="code">
(function(){
'use strict';
const SITE='Descargas',WAIT=10000,K='baul-adm';
const AD_CODE=''; // pegá acá el código del anuncio (AdSense). Solo carga si la página está en tu propio dominio.
const ADMIN='a4d9c09b2d094e7bb4977ffa0f8186cd2ee34038918683c0bdd37dd4fe51bdbe';
const PLATS=['Android','Windows','macOS','Linux','Otro'];
const HEAD='<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Descargas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:wght@400;600;700&display=swap">';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const okUrl=u=>/^https?:\/\//i.test(u||'');
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const ini=s=>s.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase()||'?';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const ls={get:()=>{try{return localStorage.getItem(K)}catch(e){return null}},set:()=>{try{localStorage.setItem(K,'1')}catch(e){}},del:()=>{try{localStorage.removeItem(K)}catch(e){}}};
const st=JSON.parse($('data').textContent);
let admin=ls.get()==='1',q='',plat='',armed='',tm=0,left=0,last=0,cur=null,tt;
const app=$('app'),dlg=document.createElement('dialog'),toastEl=document.createElement('div');
toastEl.id='toast';toastEl.setAttribute('role','status');toastEl.hidden=true;
document.body.append(dlg,toastEl);

const build=items=>HEAD+'<style id="css">'+$('css').textContent+'</style></head><body><div id="app"></div><script id="data" type="application/json">'+JSON.stringify({items}).replace(/</g,'\\u003c')+'<\/script><script id="code">'+$('code').textContent+'<\/script></body></html>';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join('')}
const toast=m=>{toastEl.textContent=m;toastEl.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{toastEl.hidden=true},4500)};
const open=(html,label)=>{dlg.setAttribute('aria-label',label);dlg.innerHTML=html;if(!dlg.open)dlg.showModal()};
const stop=()=>{clearInterval(tm);tm=0};
const shut=()=>{stop();if(dlg.open)dlg.close()};
dlg.addEventListener('close',stop);
dlg.addEventListener('click',e=>{if(e.target===dlg)shut()});

const row=i=>'<article class="row"><div class="ico" aria-hidden="true" style="background:hsl('+hue(i.name)+' 45% 36%)">'+esc(ini(i.name))+'</div><div class="txt"><h3>'+esc(i.name)+(i.ver?' <span class="ver">'+esc(i.ver)+'</span>':'')+'</h3>'+(i.desc?'<p>'+esc(i.desc)+'</p>':'')+'<div class="meta"><span class="tag">'+esc(i.plat)+'</span>'+(i.size?'<span>'+esc(i.size)+'</span>':'')+'</div>'+(admin?'<div class="adm"><button class="lnk" data-a="edit" data-id="'+esc(i.id)+'">Editar</button><button class="lnk bad" data-a="del" data-id="'+esc(i.id)+'">'+(armed===i.id?'Confirmar: borrar':'Borrar')+'</button></div>':'')+'</div><button class="btn go" data-a="dl" data-id="'+esc(i.id)+'">Descargar</button></article>';

function list(){
 const ps=[...new Set(st.items.map(i=>i.plat).filter(Boolean))];
 if(plat&&!ps.includes(plat))plat='';
 $('chips').innerHTML=ps.length>1?[''].concat(ps).map(p=>'<button class="chip" data-a="plat" data-p="'+esc(p)+'" aria-pressed="'+(p===plat)+'">'+(esc(p)||'Todos')+'</button>').join(''):'';
 const rows=st.items.filter(i=>(!plat||i.plat===plat)&&(!q||(i.name+' '+i.desc).toLowerCase().includes(q)));
 $('list').innerHTML=rows.length?rows.map(row).join(''):'<p class="empty">'+(st.items.length?'No hay resultados.':admin?'Todavía no hay archivos. Agregá el primero con el botón de arriba.':'Todavía no hay archivos publicados.')+'</p>';
}
function render(){
 app.innerHTML='<div class="hd"><div class="in"><div class="brand"><span class="mark"></span>'+SITE+'</div>'+(admin?'<div class="who"><span>David Romero</span><button class="btn ghost" data-a="out">Salir</button></div>':'<button class="btn ghost" data-a="in">Iniciar sesión</button>')+'</div></div><main><section class="intro"><h1>Apps y programas para descargar</h1><p>Elegí un archivo y esperá 10 segundos: el botón de descarga se habilita solo.</p></section>'+(admin?'<div class="admbar"><span>Estás editando la lista.</span><button class="btn" data-a="add">Agregar archivo</button></div>':'')+'<div class="ctl"><input id="q" class="q" type="search" placeholder="Buscar por nombre" aria-label="Buscar" autocomplete="off" value="'+esc(q)+'"><div class="chips" id="chips"></div></div><div id="list"></div></main>';
 list();
}

function loginDlg(){open('<form class="f" data-f="login"><h2>Iniciar sesión</h2><p class="sub">Solo para administrar los archivos.</p><label for="u">Usuario</label><input id="u" name="u" autocomplete="username" required><label for="p">Contraseña</label><input id="p" name="p" type="password" autocomplete="current-password" required><p class="err" role="alert"></p><div class="acts"><button type="button" class="lnk" data-a="x">Cancelar</button><button class="btn" type="submit">Entrar</button></div></form>','Iniciar sesión')}
function itemDlg(id){
 const it=st.items.find(x=>x.id===id)||{plat:'Android'};
 open('<form class="f" data-f="item"><h2>'+(id?'Editar archivo':'Agregar archivo')+'</h2><input type="hidden" name="id" value="'+esc(id||'')+'"><label for="n1">Nombre</label><input id="n1" name="name" required maxlength="60" value="'+esc(it.name)+'"><div class="two"><div><label for="v1">Versión</label><input id="v1" name="ver" maxlength="20" value="'+esc(it.ver)+'"></div><div><label for="s1">Tamaño</label><input id="s1" name="size" maxlength="20" placeholder="48 MB" value="'+esc(it.size)+'"></div></div><label for="p1">Plataforma</label><select id="p1" name="plat">'+PLATS.map(p=>'<option'+(p===it.plat?' selected':'')+'>'+p+'</option>').join('')+'</select><label for="d1">Descripción</label><textarea id="d1" name="desc" maxlength="160">'+esc(it.desc)+'</textarea><label for="l1">Enlace de descarga</label><input id="l1" name="url" type="url" required placeholder="https://" value="'+esc(it.url)+'"><p class="err" role="alert"></p><div class="acts"><button type="button" class="lnk" data-a="x">Cancelar</button><button class="btn" type="submit">Guardar</button></div></form>',id?'Editar archivo':'Agregar archivo');
}

async function save(items,err,btn){
 if(btn){btn.disabled=true;btn.textContent='Guardando…'}
 try{
  const a=window.claude&&claude.use?await claude.use('artifact'):null;
  if(!a)throw {code:'none'};
  await a.publish(build(items));
 }catch(e){
  const c=e&&e.code;
  if(c==='conflict')return;
  const m=(c==='none'||c==='not_writer'||c==='not_granted'||c==='not_declared'||c==='capability_disabled')?'Esta cuenta no puede guardar cambios. Abrí la página con la cuenta dueña.':'No se pudo guardar. Probá de nuevo.';
  if(err)err.textContent=m;else toast(m);
  if(btn){btn.disabled=false;btn.textContent='Guardar'}
 }
}
function del(id){
 if(armed!==id){armed=id;list();setTimeout(()=>{if(armed===id){armed='';list()}},3500);return}
 armed='';save(st.items.filter(x=>x.id!==id));
}

function mountAd(){
 const box=$('ad');
 if(!AD_CODE){box.innerHTML='<span>Publicidad</span>';return}
 box.innerHTML=AD_CODE;
 box.querySelectorAll('script').forEach(o=>{const n=document.createElement('script');Array.from(o.attributes).forEach(a=>n.setAttribute(a.name,a.value));n.text=o.text;o.replaceWith(n)});
}
function dl(id){
 cur=st.items.find(x=>x.id===id);if(!cur)return;
 open('<div class="dw"><h2>'+esc(cur.name)+(cur.ver?' <span class="ver">'+esc(cur.ver)+'</span>':'')+'</h2><p class="sub">Tu descarga se habilita cuando termina la cuenta.</p><div class="ad" id="ad"></div><div class="cnt"><b id="n">10</b><span id="lb">segundos</span></div><div class="bar"><i id="fill"></i></div><p class="hint" id="hint"></p><div class="acts"><button type="button" class="lnk" data-a="x">Cancelar</button><a class="btn off" id="get" role="button" aria-disabled="true">Descargar archivo</a></div></div>',cur.name);
 mountAd();left=WAIT;last=performance.now();stop();tm=setInterval(tick,200);tick();
}
function tick(){
 if(!$('n')){stop();return}
 const now=performance.now(),vis=document.visibilityState==='visible';
 if(vis)left=Math.max(0,left-(now-last));
 last=now;
 const s=Math.ceil(left/1000),done=left<=0;
 $('n').textContent=done?'Listo':s;
 $('lb').textContent=done?'ya podés descargar':(s===1?'segundo':'segundos');
 $('fill').style.width=((WAIT-left)/WAIT*100)+'%';
 $('hint').textContent=(done||vis)?'':'Cuenta en pausa: volvé a esta pestaña.';
 if(done){
  stop();
  const g=$('get');g.classList.remove('off');g.removeAttribute('aria-disabled');
  if(okUrl(cur.url)){g.href=cur.url;g.target='_blank';g.rel='noopener noreferrer'}
 }
}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-a]');if(!t)return;
 const a=t.dataset.a,id=t.dataset.id;
 if(a==='dl')dl(id);
 else if(a==='in')loginDlg();
 else if(a==='out'){ls.del();admin=false;armed='';render()}
 else if(a==='add')itemDlg();
 else if(a==='edit')itemDlg(id);
 else if(a==='del')del(id);
 else if(a==='x')shut();
 else if(a==='plat'){plat=t.dataset.p;list()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.trim().toLowerCase();list()}});
document.addEventListener('visibilitychange',()=>{if(tm)tick()});
document.addEventListener('submit',async e=>{
 e.preventDefault();
 const f=e.target,d=Object.fromEntries(new FormData(f)),err=f.querySelector('.err');
 if(f.dataset.f==='login'){
  let ok=false;
  try{ok=(await sha(d.u.trim().toLowerCase().replace(/\s+/g,' ')+'|'+d.p))===ADMIN}catch(x){}
  if(ok){ls.set();admin=true;shut();render()}else err.textContent='Usuario o contraseña incorrectos.';
 }else if(f.dataset.f==='item'){
  const url=d.url.trim();
  if(!okUrl(url)){err.textContent='El enlace tiene que empezar con http:// o https://';return}
  const it={id:d.id||uid(),name:d.name.trim(),ver:d.ver.trim(),plat:d.plat,size:d.size.trim(),desc:d.desc.trim(),url};
  save(d.id?st.items.map(x=>x.id===d.id?it:x):[it].concat(st.items),err,f.querySelector('[type=submit]'));
 }
});
render();
})();
</script>
</body>
</html>
